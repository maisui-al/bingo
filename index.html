<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ビンゴカード</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            font-family: sans-serif;
            text-align: center;
        }

        h1 {
            margin: 10px 0 20px;
        }

        .bingo-card {
            width: min(90vw, 500px);
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .header {
            background: #333;
            color: white;
            font-size: clamp(20px, 6vw, 32px);
            font-weight: bold;
            padding: 8px 0;
        }

        .cell {
            aspect-ratio: 1 / 1;
            background: white;
            border: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(18px, 6vw, 30px);
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>ビンゴカード</h1>

    <div class="bingo-card" id="bingo-card">
        <!-- JavaScriptでここにカードを生成します -->
    </div>

    <script>
        // 指定した範囲から、重複しない数字を5個選ぶ
        function getRandomNumbers(min, max, count) {
            const numbers = [];

            while (numbers.length < count) {
                const number =
                    Math.floor(Math.random() * (max - min + 1)) + min;

                if (!numbers.includes(number)) {
                    numbers.push(number);
                }
            }

            return numbers;
        }

        // 各列の数字を作成
        const columns = [
            getRandomNumbers(1, 20, 5),   // B
            getRandomNumbers(21, 40, 5),  // I
            getRandomNumbers(41, 60, 5),  // N
            getRandomNumbers(61, 80, 5),  // G
            getRandomNumbers(81, 99, 5)   // O
        ];

        const card = document.getElementById("bingo-card");

        // B I N G O の見出し
        const headers = ["B", "I", "N", "G", "O"];

        headers.forEach(header => {
            const element = document.createElement("div");
            element.className = "header";
            element.textContent = header;
            card.appendChild(element);
        });

        // ビンゴカードを作成
        for (let row = 0; row < 5; row++) {
            for (let column = 0; column < 5; column++) {
                const element = document.createElement("div");
                element.className = "cell";

                const number = columns[column][row];

                // 1桁の数字は 01 のように表示
                element.textContent = String(number).padStart(2, "0");

                card.appendChild(element);
            }
        }
    </script>

</body>
</html>
