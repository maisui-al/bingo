<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下二桁ビンゴ用カード</title>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .bingo-card {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            width: min(90vw, 500px);
            margin: 0 auto;
            border: 2px solid #333;
        }

        .cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #333;
            font-size: clamp(18px, 5vw, 32px);
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
        }

        .cell.opened {
            background-color: #555;
            color: white;
        }

        .status {
            margin-top: 25px;
            font-size: 20px;
        }

        .status p {
            margin: 8px 0;
        }

        .bingo-time {
            font-size: 18px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<h1>下二桁ビンゴ用カード</h1>

<div class="bingo-card" id="bingo-card"></div>

<div class="status">
    <p>リーチ：<strong id="reach-count">0</strong></p>
    <p>ビンゴ：<strong id="bingo-count">0</strong></p>
    <p class="bingo-time" id="bingo-time"></p>
</div>

<script>
    // -----------------------------
    // ビンゴカードの生成
    // -----------------------------

    function getRandomNumbers(min, max, count) {
        const numbers = [];

        while (numbers.length < count) {
            const number =
                Math.floor(Math.random() * (max - min + 1)) + min;

            if (!numbers.includes(number)) {
                numbers.push(number);
            }
        }

        return numbers;
    }

    // 既にカードが保存されていれば、それを使用
    const savedCard = localStorage.getItem("bingoCard");

    let columns;

    if (savedCard) {
        columns = JSON.parse(savedCard);
    } else {
        columns = [
            getRandomNumbers(1, 20, 5),   // B
            getRandomNumbers(21, 40, 5),  // I
            getRandomNumbers(41, 60, 5),  // N
            getRandomNumbers(61, 80, 5),  // G
            getRandomNumbers(81, 99, 5)   // O
        ];

        localStorage.setItem(
            "bingoCard",
            JSON.stringify(columns)
        );
    }


    // -----------------------------
    // 開いたマスの読み込み
    // -----------------------------

    let opened = JSON.parse(
        localStorage.getItem("bingoOpened") || "[]"
    );


    // -----------------------------
    // ビンゴ達成時間
    // -----------------------------

    // V2用のキーを使用
    // （以前のテストで保存された時刻と混ざらないようにする）
    let bingoTime = localStorage.getItem("bingoTimeV2");


    // ページを開いた時点でのビンゴ数を記録
    // ※ここでは時刻を記録しない
    let previousBingoCount = 0;


    // -----------------------------
    // ビンゴカードを表示
    // -----------------------------

    const cardElement = document.getElementById("bingo-card");

    for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {

            const index = row * 5 + col;

            const cell = document.createElement("div");
            cell.classList.add("cell");

            const number = columns[col][row];

            // 2桁表示
            cell.textContent =
                String(number).padStart(2, "0");

            // 既に開いているマス
            if (opened.includes(index)) {
                cell.classList.add("opened");
            }

            // マスをタップ
            cell.addEventListener("click", function () {

                if (opened.includes(index)) {

                    // 開いている → 閉じる
                    opened = opened.filter(
                        i => i !== index
                    );

                    cell.classList.remove("opened");

                } else {

                    // 閉じている → 開く
                    opened.push(index);

                    cell.classList.add("opened");
                }


                // 状態を保存
                localStorage.setItem(
                    "bingoOpened",
                    JSON.stringify(opened)
                );


                // 判定を更新
                updateStatus();
            });

            cardElement.appendChild(cell);
        }
    }


    // -----------------------------
    // リーチ・ビンゴ判定
    // -----------------------------

    function updateStatus() {

        const lines = [];

        // 横5本
        for (let row = 0; row < 5; row++) {

            const line = [];

            for (let col = 0; col < 5; col++) {
                line.push(row * 5 + col);
            }

            lines.push(line);
        }


        // 縦5本
        for (let col = 0; col < 5; col++) {

            const line = [];

            for (let row = 0; row < 5; row++) {
                line.push(row * 5 + col);
            }

            lines.push(line);
        }


        // 左上 → 右下
        lines.push([
            0, 6, 12, 18, 24
        ]);


        // 右上 → 左下
        lines.push([
            4, 8, 12, 16, 20
        ]);


        // -----------------------------
        // 各ラインを判定
        // -----------------------------

        let reachCount = 0;
        let bingoCount = 0;

        for (const line of lines) {

            const openedCount =
                line.filter(
                    index => opened.includes(index)
                ).length;


            // 4マスだけ開いている → リーチ
            if (openedCount === 4) {
                reachCount++;
            }


            // 5マスすべて開いている → ビンゴ
            if (openedCount === 5) {
                bingoCount++;
            }
        }


        // -----------------------------
        // ビンゴ達成時間
        // -----------------------------

        /*
         * 「ビンゴ数 0 → 1」になった瞬間だけ記録する。
         *
         * その後、
         * 1 → 2
         * 2 → 3
         * ...
         * となっても時刻は変更しない。
         *
         * また、一度記録された時刻は
         * マスを閉じてビンゴ数が0になっても消さない。
         */

        if (
            previousBingoCount === 0 &&
            bingoCount > 0 &&
            !bingoTime
        ) {
            bingoTime = new Date();

            localStorage.setItem(
                "bingoTimeV2",
                bingoTime.toISOString()
            );
        }


        // 現在のビンゴ数を次回判定用に保存
        previousBingoCount = bingoCount;


        // -----------------------------
        // 画面更新
        // -----------------------------

        document.getElementById("reach-count")
            .textContent = reachCount;

        document.getElementById("bingo-count")
            .textContent = bingoCount;


        // ビンゴ達成時間
        const timeElement =
            document.getElementById("bingo-time");

        if (bingoTime) {

            const date = new Date(bingoTime);

            const hours =
                String(date.getHours()).padStart(2, "0");

            const minutes =
                String(date.getMinutes()).padStart(2, "0");

            const seconds =
                String(date.getSeconds()).padStart(2, "0");

            timeElement.textContent =
                `ビンゴ達成時刻：${hours}:${minutes}:${seconds}`;

        } else {

            timeElement.textContent =
                "ビンゴ達成時刻：---";
        }
    }


    // -----------------------------
    // 初期表示
    // -----------------------------

    // 現在のビンゴ数を取得するために一度実行
    // この時点では previousBingoCount が0なので、
    // 既にビンゴ状態で読み込まれても時刻は記録されない。
    updateStatus();

</script>

</body>
</html>
